<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Arial, sans-serif">
  <title>The whole flow: from a posted sale to the G/L</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6961e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#ffffff"/>

  <!-- title -->
  <text x="50" y="60" font-size="34" font-weight="bold" fill="#13294b">The whole flow: from a posted sale to the G/L</text>
  <text x="50" y="92" font-size="18" fill="#5a6472">Four separate stages. Stages 2 to 4 are started by a person or the Job Queue, never by sales posting.</text>

  <!-- row labels (gutter) -->
  <g font-size="14" font-weight="bold" fill="#5a6472" letter-spacing="1">
    <text x="45" y="190">WHO</text>
    <text x="45" y="236">WHAT</text>
    <text x="45" y="654">CODE</text>
    <text x="45" y="754">WRITES TO</text>
    <text x="45" y="906">EXAMPLE</text>
  </g>

  <!-- dashed amber split: standard BC | royalty app -->
  <line x1="497.5" y1="162" x2="497.5" y2="824" stroke="#e6961e" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-size="13" font-weight="bold" fill="#a2650a" text-anchor="middle">
    <text x="491" y="300" transform="rotate(-90 491 300)">standard BC</text>
    <text x="514" y="300" transform="rotate(-90 514 300)">royalty app</text>
  </g>

  <!-- stage headers -->
  <g>
    <circle cx="182" cy="138" r="18" fill="#0e7c86"/><text x="182" y="145" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="210" y="146" font-size="21" font-weight="bold" fill="#13294b">Post the sale</text>
    <circle cx="542" cy="138" r="18" fill="#0e7c86"/><text x="542" y="145" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="570" y="146" font-size="21" font-weight="bold" fill="#13294b">Calculate royalties</text>
    <circle cx="902" cy="138" r="18" fill="#0e7c86"/><text x="902" y="145" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="930" y="146" font-size="21" font-weight="bold" fill="#13294b">Statement and approval</text>
    <circle cx="1262" cy="138" r="18" fill="#0e7c86"/><text x="1262" y="145" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="1290" y="146" font-size="21" font-weight="bold" fill="#13294b">Accrual and G/L</text>
  </g>
  <g stroke="#0e7c86" stroke-width="3" marker-end="url(#arr)">
    <line x1="360" y1="138" x2="519" y2="138" stroke-dasharray="7 5"/>
    <line x1="780" y1="138" x2="879" y2="138"/>
    <line x1="1182" y1="138" x2="1239" y2="138"/>
  </g>

  <!-- WHO chips -->
  <g font-size="16" fill="#13294b">
    <rect x="160" y="166" width="315" height="36" rx="18" fill="#eef3f7" stroke="#13294b"/>
    <text x="317.5" y="190" text-anchor="middle">User (sales)</text>
    <rect x="520" y="166" width="315" height="36" rx="18" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="677.5" y="190" text-anchor="middle">Scheduler (Job Queue) or a user</text>
    <rect x="880" y="166" width="315" height="36" rx="18" fill="#eef3f7" stroke="#13294b"/>
    <text x="1037.5" y="190" text-anchor="middle">User, then an Approver</text>
    <rect x="1240" y="166" width="315" height="36" rx="18" fill="#e6f4ea" stroke="#2e7d32"/>
    <text x="1397.5" y="190" text-anchor="middle">User, then Finance</text>
  </g>

  <!-- STAGE 1 boxes (4) -->
  <g font-size="15" fill="#1e232d">
    <rect x="160" y="214" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="174" y="247">User posts a Sales Invoice</text><text x="174" y="266">or a Sales Credit Memo</text>
    <rect x="160" y="324" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="174" y="357">Standard BC posting runs</text><text x="174" y="376">(no royalty code in here)</text>
    <rect x="160" y="434" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="174" y="467">BC writes Value Entries</text><text x="174" y="486">with Sales Amount (Actual)</text>
    <rect x="160" y="544" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="174" y="577">plus Item Ledger Entries and</text><text x="174" y="596">G/L Entries for the sale itself</text>
  </g>
  <g stroke="#0e7c86" stroke-width="2" marker-end="url(#arr)">
    <line x1="317.5" y1="294" x2="317.5" y2="322"/>
    <line x1="317.5" y1="404" x2="317.5" y2="432"/>
    <line x1="317.5" y1="514" x2="317.5" y2="542"/>
  </g>

  <!-- STAGE 2 boxes (5) -->
  <g font-size="15" fill="#1e232d">
    <rect x="520" y="214" width="315" height="66" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="534" y="236">Job Queue runs codeunit 50100, or</text><text x="534" y="255">user clicks Calculate Royalties on</text><text x="534" y="274">Royalty Setup (page 50100)</text>
    <rect x="520" y="298" width="315" height="48" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="534" y="319">Read Value Entries after</text><text x="534" y="338">Last Processed Value Entry No.</text>
    <rect x="520" y="364" width="315" height="48" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="534" y="385">Keep: Sale, Sales Invoice or</text><text x="534" y="404">Sales Credit Memo, no item charge</text>
    <rect x="520" y="430" width="315" height="105" rx="8" fill="#fdf1dc" stroke="#e6961e"/>
    <text x="534" y="452"><tspan font-weight="bold" fill="#a2650a">Skip</tspan> if: zero sales, item not found,</text>
    <text x="534" y="471">item has no contract, contract not</text>
    <text x="534" y="490">found, contract Blocked, posting</text>
    <text x="534" y="509">date outside contract dates, or a</text>
    <text x="534" y="528">royalty entry for it already exists</text>
    <rect x="520" y="553" width="315" height="66" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="534" y="575">Insert 1 Royalty Ledger</text><text x="534" y="594">Entry per value entry:</text><text x="534" y="613" font-family="Consolas, monospace" font-size="14">Round(Sales * Rate % / 100)</text>
  </g>
  <g stroke="#0e7c86" stroke-width="2" marker-end="url(#arr)">
    <line x1="677.5" y1="282" x2="677.5" y2="296"/>
    <line x1="677.5" y1="348" x2="677.5" y2="362"/>
    <line x1="677.5" y1="414" x2="677.5" y2="428"/>
    <line x1="677.5" y1="537" x2="677.5" y2="551"/>
  </g>
  <text x="688" y="549" font-size="14" font-style="italic" fill="#0e7c86">otherwise</text>

  <!-- STAGE 3 boxes (5) with status pills -->
  <g font-size="15" fill="#1e232d">
    <rect x="880" y="214" width="315" height="66" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="894" y="235">New statement</text><text x="894" y="255">Enter Contract No., Period Start,</text><text x="894" y="274">Period End (End not before Start)</text>
    <rect x="880" y="304" width="315" height="66" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="894" y="326">Collect Entries: this contract, no</text><text x="894" y="345">Statement No., Posting Date up to</text><text x="894" y="364">Period End; sets their Statement No.</text>
    <rect x="880" y="394" width="315" height="66" rx="8" fill="#ffffff" stroke="#0e7c86" stroke-dasharray="6 4"/>
    <text x="894" y="416"><tspan font-weight="bold">Recalculate</tspan> (automatic, no button):</text><text x="894" y="435">runs inside Collect Entries and again</text><text x="894" y="454">in Review. Earned, Recouped, Payable</text>
    <rect x="880" y="484" width="315" height="66" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="894" y="505">Review: Reviewed By = user</text><text x="894" y="525" fill="#a2650a">Reopen (only from Reviewed): back</text><text x="894" y="544" fill="#a2650a">to Draft, clears Reviewed By</text>
    <rect x="880" y="574" width="315" height="48" rx="8" fill="#e6f4ea" stroke="#2e7d32"/>
    <text x="894" y="595">Approve: approvers only,</text><text x="894" y="614">recoupment checked again</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="1103" y="219" width="82" height="22" rx="11" fill="#eef3f7" stroke="#5a6472"/><text x="1144" y="235" fill="#5a6472">Draft</text>
    <rect x="1103" y="489" width="82" height="22" rx="11" fill="#e1f0f1" stroke="#0e7c86"/><text x="1144" y="505" fill="#0e7c86">Reviewed</text>
    <rect x="1103" y="587" width="82" height="22" rx="11" fill="#2e7d32" stroke="#2e7d32"/><text x="1144" y="603" fill="#ffffff">Approved</text>
  </g>
  <g stroke="#0e7c86" stroke-width="2" marker-end="url(#arr)">
    <line x1="1037.5" y1="282" x2="1037.5" y2="302"/>
    <line x1="1037.5" y1="372" x2="1037.5" y2="392"/>
    <line x1="1037.5" y1="462" x2="1037.5" y2="482"/>
    <line x1="1037.5" y1="552" x2="1037.5" y2="572"/>
  </g>
  <!-- Reopen loop back to Draft -->
  <path d="M880,526 H858 V247 H877" fill="none" stroke="#e6961e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrA)"/>

  <!-- STAGE 4 boxes (4) -->
  <g font-size="15" fill="#1e232d">
    <rect x="1240" y="214" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="1254" y="238">Create Accrual Journal Lines</text><text x="1254" y="257">(action on the statement page,</text><text x="1254" y="276">Approved statements only)</text>
    <rect x="1240" y="324" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="1254" y="348">Up to 3 lines in the setup batch,</text><text x="1254" y="367">Document No. = statement no.</text><text x="1254" y="386" fill="#5a6472">(lines only, nothing posted yet)</text>
    <rect x="1240" y="434" width="315" height="78" rx="8" fill="#e1f0f1" stroke="#0e7c86"/>
    <text x="1254" y="458">OpenJournal opens the batch.</text><text x="1254" y="477">Finance runs Preview Posting</text><text x="1254" y="496">and checks the lines</text>
    <rect x="1240" y="544" width="315" height="78" rx="8" fill="#e6f4ea" stroke="#2e7d32"/>
    <text x="1254" y="568">Finance: Post</text><text x="1254" y="587">(standard BC journal posting)</text><text x="1254" y="606">BC writes the G/L Entries</text>
  </g>
  <g stroke="#0e7c86" stroke-width="2" marker-end="url(#arr)">
    <line x1="1397.5" y1="294" x2="1397.5" y2="322"/>
    <line x1="1397.5" y1="404" x2="1397.5" y2="432"/>
    <line x1="1397.5" y1="514" x2="1397.5" y2="542"/>
  </g>

  <!-- CODE row -->
  <g>
    <rect x="160" y="632" width="315" height="90" rx="8" fill="#eef3f7" stroke="#13294b"/>
    <text x="174" y="654" font-size="17" font-weight="bold" fill="#13294b">Codeunit 80</text>
    <text x="174" y="674" font-size="14" font-family="Consolas, monospace" fill="#1e232d">"Sales-Post"</text>
    <text x="174" y="694" font-size="15" fill="#5a6472">standard BC, not changed</text>

    <rect x="520" y="632" width="315" height="90" rx="8" fill="#eef3f7" stroke="#13294b"/>
    <text x="534" y="654" font-size="17" font-weight="bold" fill="#13294b">Codeunit 50100</text>
    <g font-size="14" font-family="Consolas, monospace" fill="#1e232d">
      <text x="534" y="674">"RYL Royalty Calculation"</text>
      <text x="534" y="693">TableNo = "Job Queue Entry"</text>
      <text x="534" y="712">OnRun and button: ProcessNewSales</text>
    </g>

    <rect x="880" y="632" width="315" height="90" rx="8" fill="#eef3f7" stroke="#13294b"/>
    <text x="894" y="654" font-size="17" font-weight="bold" fill="#13294b">Codeunit 50101</text>
    <g font-size="14" font-family="Consolas, monospace" fill="#1e232d">
      <text x="894" y="674">"RYL Statement Management"</text>
      <text x="894" y="693">CollectEntries, Recalculate,</text>
      <text x="894" y="712">Review, Reopen, Approve</text>
    </g>

    <rect x="1240" y="632" width="315" height="90" rx="8" fill="#eef3f7" stroke="#13294b"/>
    <text x="1254" y="654" font-size="17" font-weight="bold" fill="#13294b">Codeunit 50102</text>
    <g font-size="14" font-family="Consolas, monospace" fill="#1e232d">
      <text x="1254" y="674">"RYL Accrual Journal"</text>
      <text x="1254" y="693">CreateLines, InsertLine, OpenJournal</text>
    </g>
    <text x="1254" y="713" font-size="15" fill="#5a6472">creates lines only, does not post</text>
  </g>

  <!-- WRITES TO row -->
  <g font-size="15">
    <rect x="160" y="732" width="315" height="92" rx="8" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
    <text x="174" y="754" font-size="17" font-weight="bold" fill="#13294b">Value Entry</text>
    <text x="174" y="775" fill="#1e232d">Item Ledger Entry, G/L Entry</text>
    <text x="174" y="795" fill="#5a6472">(standard BC tables)</text>

    <rect x="520" y="732" width="315" height="92" rx="8" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
    <text x="534" y="754" font-size="17" font-weight="bold" fill="#13294b">50102 RYL Royalty Ledger Entry</text>
    <text x="534" y="775" fill="#1e232d">50100 RYL Royalty Setup: pointer =</text>
    <text x="534" y="795" fill="#1e232d">last entry read, skipped ones too,</text>
    <text x="534" y="815" fill="#5a6472">saved once at the end of the run</text>

    <rect x="880" y="732" width="315" height="92" rx="8" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
    <text x="894" y="754" font-size="17" font-weight="bold" fill="#13294b">50103 RYL Royalty Statement</text>
    <text x="894" y="775" fill="#1e232d">50102 entries: Statement No. set</text>
    <text x="894" y="795" fill="#1e232d">50104 RYL Statement Audit Entry</text>
    <text x="894" y="815" fill="#5a6472">(one per status change)</text>

    <rect x="1240" y="732" width="315" height="92" rx="8" fill="#ffffff" stroke="#13294b" stroke-width="2"/>
    <text x="1254" y="754" font-size="17" font-weight="bold" fill="#13294b">Gen. Journal Line</text>
    <text x="1254" y="775" fill="#1e232d">then G/L Entry when Finance posts</text>
    <text x="1254" y="795" fill="#5a6472">Posting Date = Period End</text>
  </g>

  <!-- banners -->
  <rect x="160" y="834" width="675" height="40" rx="8" fill="#fdf1dc" stroke="#e6961e" stroke-width="2"/>
  <text x="497.5" y="860" font-size="16" fill="#1e232d" text-anchor="middle"><tspan font-weight="bold" fill="#a2650a">Nothing runs inside sales posting.</tspan> Codeunit 50100 reads Value Entries later.</text>
  <rect x="880" y="834" width="675" height="40" rx="8" fill="#e1f0f1" stroke="#0e7c86" stroke-width="2"/>
  <text x="1217.5" y="860" font-size="16" fill="#1e232d" text-anchor="middle"><tspan font-weight="bold" fill="#0e7c86">No royalty amount reaches the G/L</tspan> until Finance posts the journal.</text>

  <!-- EXAMPLE row -->
  <g font-size="15" fill="#1e232d">
    <rect x="160" y="884" width="315" height="76" rx="8" fill="#eef3f7"/>
    <text x="174" y="906">Invoice: 500 x 4.00 = 2,000</text>
    <text x="174" y="928">Credit memo: 50 x 4.00 = -200</text>
    <text x="174" y="950" fill="#5a6472">(net sales in Value Entries)</text>

    <rect x="520" y="884" width="315" height="76" rx="8" fill="#eef3f7"/>
    <text x="534" y="906">Rate 8%: royalty 160</text>
    <text x="534" y="928">Credit memo entry: -16</text>
    <text x="534" y="950" font-weight="bold">Contract total: 144</text>

    <rect x="880" y="884" width="315" height="76" rx="8" fill="#eef3f7"/>
    <text x="894" y="906">Earned 144</text>
    <text x="894" y="928">Advance = 0, so Recouped 0</text>
    <text x="894" y="950" font-weight="bold">Payable 144</text>

    <rect x="1240" y="884" width="315" height="76" rx="8" fill="#eef3f7"/>
    <text x="1254" y="906">Dr Royalty Expense Account 144</text>
    <text x="1254" y="928">Cr Accrued Royalties Account 144</text>
    <text x="1254" y="950" fill="#5a6472">(Recouped 0, so no advance line)</text>
  </g>
</svg>
